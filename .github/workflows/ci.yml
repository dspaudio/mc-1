name: build-and-test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test all
      - name: Sanitizers
        run: |
          cc -O1 -g -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -Isrc src/effects.c src/demo.c src/engine.c src/factory.c src/project.c src/store.c src/ui.c tests/test.c -o build/test-sanitized
          build/test-sanitized
      - run: python3 tools/gen_assets.py && python3 tools/gen_presets.py && git diff --exit-code src/tables.h src/factory.c host/index.html README.md docs/PRESETS.md
      - run: python3 tests/host_http.py
      - run: python3 tools/verify_audio.py
      - run: python3 tools/showcase.py
      - run: diff docs/audio-report.json build/audio-report.json && git diff --exit-code docs/showcase-report.json docs/audio/
      - uses: actions/upload-artifact@v4
        with:
          name: host-audio-evidence
          path: |
            build/audio-report.json
            build/demo.wav
  target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verified official compiler
        run: |
          curl --fail --location --retry 3 https://jl-update.oss-cn-shenzhen.aliyuncs.com/jieli-linux-toolchains-20260730.1.tar.xz -o /tmp/jieli.tar.xz
          echo 'a1545cddbc451a06bac43eb5cd96d831470c42a97c5c0b1f98879a20fc7647bd  /tmp/jieli.tar.xz' | sha256sum -c -
          mkdir -p /tmp/mcfm-toolchain
          tar -xJf /tmp/jieli.tar.xz -C /tmp/mcfm-toolchain
      - name: Target compile and memory guards (not a hardware test)
        env:
          JIELI_TOOLCHAIN: /tmp/mcfm-toolchain/jieli-linux-toolchains-20260730.1
        run: make target
      - name: Pinned official SDK and experimental package
        env:
          JIELI_TOOLCHAIN: /tmp/mcfm-toolchain/jieli-linux-toolchains-20260730.1
          AC79_SDK: /tmp/mcfm-sdk
        run: |
          git clone --depth 1 --single-branch --branch AC79NN_SDK_V1.2.1_2023-12-13 --filter=blob:none --sparse https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git /tmp/mcfm-sdk
          git -C /tmp/mcfm-sdk sparse-checkout set cpu/wl82/tools
          test "$(git -C /tmp/mcfm-sdk rev-parse HEAD)" = d179b4484759423312073f5fbb232501aa491047
          python3 tools/build_package.py
          diff docs/target-report.json build/target-report.json
          diff docs/package-report.json build/package-report.json
          cc -O1 -g -Wall -Wextra -Werror -Wno-unused-function -fsanitize=address,undefined -fno-sanitize-recover=all tests/ldr_test.c -o build/ldr-test
          build/ldr-test build/previous-test-only.fwsc build/mc-1-EXPERIMENTAL.fwsc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimental-target-NOT-DEVICE-TESTED
          path: |
            build/mc-1.elf
            build/mc-1.app.bin
            build/mc-1.dis
            build/mc-1.symbols
            build/target-report.json
            build/package-report.json
            build/mc-1-EXPERIMENTAL.fwsc
            build/loader/
