name: product-pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-pages
  cancel-in-progress: false

jobs:
  package:
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check firmware installer without hardware access
        run: |
          node tests/firmware-ota.mjs
          node tests/firmware-stock.mjs
          node tests/firmware-install.mjs
      - name: Assemble product and installer site from pinned release
        run: python3 tools/make_site.py --out _site
      - name: Validate relative resources and fragments
        run: python3 tests/site_test.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
